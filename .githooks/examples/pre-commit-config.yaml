default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: format
        name: Formato
        entry: ./scripts/format.sh --check
        language: system
        files: \.java$
        pass_filenames: false

      - id: lint
        name: Linter
        entry: ./scripts/lint.sh
        language: system
        files: \.java$
        pass_filenames: false

      - id: arch
        name: Consola solo en App
        entry: ./scripts/arch.sh
        language: system
        files: ^src/main/java/.*\.java$
        pass_filenames: false

      - id: commit-msg
        name: Conventional Commits
        entry: .githooks/commit-msg
        language: system
        stages: [commit-msg]

      - id: test
        name: Tests
        entry: ./scripts/test.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
